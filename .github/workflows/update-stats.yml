name: Update profile stats

on:
  schedule:
    - cron: "27 6 * * *"   # daily, 06:27 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query pull request counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          user=sofianebeloucif
          total=$(gh api -X GET search/issues -f q="type:pr author:$user -user:$user" --jq '.total_count')
          merged=$(gh api -X GET search/issues -f q="type:pr author:$user -user:$user is:merged" --jq '.total_count')
          echo "TOTAL=$total"   >> "$GITHUB_ENV"
          echo "MERGED=$merged" >> "$GITHUB_ENV"

      - name: Write the badge into README
        run: |
          badge="https://img.shields.io/badge/open--source_PRs-${TOTAL}_total%2C_${MERGED}_merged-8957e5?style=flat-square"
          md="<img alt=\"Open-source pull requests\" src=\"${badge}\">"
          sed -i "s|<!--PRS_START-->.*<!--PRS_END-->|<!--PRS_START-->${md}<!--PRS_END-->|" README.md
          echo "$md"

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "no change"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh open-source PR stats"
            git push
          fi
