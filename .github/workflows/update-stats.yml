name: Update profile stats

on:
  schedule:
    - cron: "27 6 * * *"   # daily, 06:27 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query pull request counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          user=sofianebeloucif
          total=$(gh api -X GET search/issues -f q="type:pr author:$user -user:$user" --jq '.total_count')
          merged=$(gh api -X GET search/issues -f q="type:pr author:$user -user:$user is:merged" --jq '.total_count')
          echo "TOTAL=$total"   >> "$GITHUB_ENV"
          echo "MERGED=$merged" >> "$GITHUB_ENV"

      - name: Render the counter SVG
        run: |
          mkdir -p assets
          cat > assets/opensource-prs.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="460" height="132" viewBox="0 0 460 132" role="img" aria-label="Open-source pull requests: ${TOTAL} opened, ${MERGED} merged">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#22272e"/>
                <stop offset="1" stop-color="#1c2128"/>
              </linearGradient>
            </defs>
            <rect x="0.75" y="0.75" width="458.5" height="130.5" rx="16" fill="url(#bg)" stroke="#373e47" stroke-width="1.5"/>
            <text x="28" y="34" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2" fill="#768390">OPEN-SOURCE PULL REQUESTS</text>
            <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
              <text x="148" y="92" font-size="50" font-weight="700" fill="#f0f6fc">${TOTAL}</text>
              <text x="148" y="113" font-size="13" font-weight="600" fill="#3fb950">opened</text>
              <line x1="240" y1="50" x2="240" y2="110" stroke="#373e47" stroke-width="1.5"/>
              <text x="332" y="92" font-size="50" font-weight="700" fill="#f0f6fc">${MERGED}</text>
              <text x="332" y="113" font-size="13" font-weight="600" fill="#a371f7">merged</text>
            </g>
          </svg>
          SVG

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/opensource-prs.svg; then
            echo "no change"
          else
            # bust GitHub's image proxy cache so the new card shows immediately
            sed -i -E "s#(opensource-prs\.svg\?v=)[0-9]+#\1$(date +%s)#" README.md
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/opensource-prs.svg README.md
            git commit -m "chore: refresh open-source PR counter"
            git push
          fi
